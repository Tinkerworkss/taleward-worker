name: Bauen
# Prüft die App bei jeder Änderung. Neue Fassung in pyproject.toml → Tag worker-v<Fassung> und Vorabfassung mit
# Installer. Veröffentlicht wird sie erst durch den Ablauf „Freigabe“ (nach Bestätigung durch Benjamin).
# Wird ein Release „worker-v…“ von Hand veröffentlicht, baut dieser Ablauf den Installer und hängt ihn an.
on:
  push:
    branches: [main]
    paths-ignore: ["*.patch"]
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch einspielen"]
    types: [completed]

permissions: {}

jobs:
  pruefen:
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'worker-v'))
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tests der App
        run: uv sync --frozen && uv run pytest -q
      - name: KI-Paket für Windows (CUDA) und Linux auflösbar?
        run: bash packaging/pruefe-ki-paket.sh
      - name: Linux-Skript
        run: shellcheck install-linux.sh packaging/pruefe-ki-paket.sh

  windows:
    needs: pruefen
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Fassung
        env:
          EREIGNIS: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EREIGNIS" = "release" ]; then
            V="${RELEASE_TAG#worker-v}"
          else
            V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          fi
          printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Unbekannte Fassung: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" taleward_worker/__init__.py
      - name: uv beilegen (installiert später das KI-Paket)
        env:
          UV_VERSION: "0.12.19"
        run: |
          mkdir -p bin
          curl -fsSL -o uv.zip "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o uv.zip.sha256 "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip.sha256"
          echo "$(cut -d' ' -f1 uv.zip.sha256)  uv.zip" | sha256sum -c -
          unzip -o -j uv.zip uv.exe -d bin
          bin/uv.exe --version
      - name: App bauen
        run: |
          uv sync --frozen --python 3.12
          uv run pyinstaller packaging/taleward-worker.spec --noconfirm
          dist/TalewardWorker/TalewardWorker.exe --pruefen
      - name: Installer bauen
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$env:VERSION" packaging\windows\taleward-worker.iss
          Copy-Item dist\TalewardWorker-Setup.exe "dist\TalewardWorker-Setup-$env:VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TalewardWorker-Setup
          path: dist/TalewardWorker-Setup*.exe

  anhaengen:
    # Von Hand veröffentlichtes Release: Installer anhängen (nie vorhandene Dateien ersetzen)
    needs: windows
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TalewardWorker-Setup
          path: dist
      - name: An das Release hängen
        run: |
          set -euo pipefail
          V="${TAG#worker-v}"
          gh release upload "$TAG" dist/TalewardWorker-Setup.exe "dist/TalewardWorker-Setup-$V.exe" install-linux.sh

  veroeffentlichen:
    # Neue Fassung in pyproject.toml → Tag worker-v<Fassung> und Vorabfassung mit Installer.
    # Die Server bieten sie erst an, wenn „Freigabe“ sie unterschrieben und veröffentlicht hat.
    needs: windows
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Neue Fassung?
        run: |
          set -euo pipefail
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Unbekannte Fassung: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if git rev-parse "worker-v$V" >/dev/null 2>&1; then
            echo "worker-v$V gibt es schon."
          else
            echo "NEU=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.NEU == '1'
        with:
          name: TalewardWorker-Setup
          path: dist
      - name: Vorabfassung anlegen
        if: env.NEU == '1'
        run: |
          set -euo pipefail
          gh release create "worker-v$VERSION" --target "$(git rev-parse HEAD)" --prerelease \
            --title "Taleward Worker $VERSION" \
            --notes "Automatisch gebaut. Wird mit der Freigabe (Ablauf Freigabe) veröffentlicht." \
            dist/TalewardWorker-Setup.exe "dist/TalewardWorker-Setup-$VERSION.exe" install-linux.sh

name: Bauen
# Prüft die App bei jeder Änderung. Wird ein Release mit Tag „worker-v…“ veröffentlicht,
# baut dieser Ablauf den Windows-Installer und hängt ihn samt Linux-Skript an das Release.
on:
  push:
    branches: [main]
    paths-ignore: ["*.patch"]
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch einspielen"]
    types: [completed]

permissions:
  contents: write

jobs:
  pruefen:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'worker-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests der App
        run: uv sync && uv run pytest -q
      - name: KI-Paket für Windows (CUDA) und Linux auflösbar?
        run: bash packaging/pruefe-ki-paket.sh
      - name: Linux-Skript
        run: shellcheck install-linux.sh packaging/pruefe-ki-paket.sh

  windows:
    needs: pruefen
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'worker-v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fassung
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"; V="${V#worker-v}"
          else
            V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" taleward_worker/__init__.py
      - name: uv beilegen (installiert später das KI-Paket)
        env:
          UV_VERSION: "0.12.19"
        run: |
          mkdir -p bin
          curl -fsSL -o uv.zip "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o uv.zip.sha256 "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip.sha256"
          echo "$(cut -d' ' -f1 uv.zip.sha256)  uv.zip" | sha256sum -c -
          unzip -o -j uv.zip uv.exe -d bin
          bin/uv.exe --version
      - name: App bauen
        run: |
          uv sync --python 3.12
          uv run pyinstaller packaging/taleward-worker.spec --noconfirm
          dist/TalewardWorker/TalewardWorker.exe --pruefen
      - name: Installer bauen
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$env:VERSION" packaging\windows\taleward-worker.iss
          Copy-Item dist\TalewardWorker-Setup.exe "dist\TalewardWorker-Setup-$env:VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: TalewardWorker-Setup
          path: dist/TalewardWorker-Setup*.exe
      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/TalewardWorker-Setup.exe \
            "dist/TalewardWorker-Setup-$VERSION.exe" install-linux.sh --clobber
veroeffentlichen:
    # Neue Fassung in pyproject.toml → Tag worker-v<Fassung> und Vorabfassung mit Installer.
    # Die Server bieten Vorabfassungen nicht an; zum Verteilen auf GitHub den Haken „pre-release“ entfernen.
    needs: windows
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neue Fassung?
        run: |
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if git rev-parse "worker-v$V" >/dev/null 2>&1; then
            echo "worker-v$V gibt es schon."
          else
            echo "NEU=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        if: env.NEU == '1'
        with:
          name: TalewardWorker-Setup
          path: dist
      - name: Vorabfassung anlegen
        if: env.NEU == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "worker-v$VERSION" --target "$(git rev-parse HEAD)" --prerelease \
            --title "Taleward Worker $VERSION" \
            --notes "Automatisch gebaut. Zum Verteilen den Haken pre-release entfernen." \
            dist/TalewardWorker-Setup.exe "dist/TalewardWorker-Setup-$VERSION.exe" install-linux.sh

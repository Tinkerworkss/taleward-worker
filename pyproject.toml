[project]
name = "taleward-worker"
version = "0.1.0"
description = "Taleward Worker – verarbeitet Aufnahmen für einen Taleward-Server auf dem eigenen PC mit Grafikkarte"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pywebview>=5.3",
    "pystray>=0.19",
    "pillow>=10",
    "httpx>=0.27",
    "platformdirs>=4",
    "truststore>=0.10",  # Zertifikate aus dem Windows-/macOS-Speicher (Virenscanner, Firmen-Proxy)
    "zstandard>=0.22; sys_platform != 'win32'",  # Ollama für Linux kommt als .tar.zst
]

[project.optional-dependencies]
# Linux: Fenster über Qt (bringt seinen eigenen Browser-Kern mit, keine Systempakete nötig)
qt = ["pywebview[qt]>=5.3"]

[project.scripts]
taleward-worker = "taleward_worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taleward_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# PyInstaller mit selbst gebautem Startprogramm (bootloader): Das vorgefertigte aus dem Wheel teilen sich viele
# fremde Programme, darunter Schadsoftware – Virenscanner schlagen deshalb bei ihm oft falsch an.
no-binary-package = ["pyinstaller"]
